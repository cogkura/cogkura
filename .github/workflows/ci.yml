name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      # Use managed CPython builds so SQLite contains the WAL-reset fix.
      # The runtime independently verifies the linked SQLite version at startup.
      - name: Install dependencies
        run: uv sync --all-extras --dev --locked --python ${{ matrix.python-version }} --managed-python

      - name: Record platform and SQLite
        run: uv run python scripts/report_sqlite_platform.py

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: MyPy
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest
