[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "cogkura"
version = "0.13.0"
description = "Research-driven cognitive memory framework for AI systems."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "George Paterson", email = "paterson.george@gmail.com" },
]
keywords = ["ai", "memory", "cognitive", "llm", "research"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
postgres = [
  "sqlalchemy[asyncio]>=2.0.51",
  "asyncpg>=0.31.0",
]

[project.urls]
Homepage = "https://cogkura.com"
Repository = "https://github.com/cogkura/cogkura"
Issues = "https://github.com/cogkura/cogkura/issues"
Documentation = "https://cogkura.com"

[dependency-groups]
dev = [
  "mypy>=2.3.0",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.1",
  "twine>=7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cogkura"]

[tool.hatch.build.targets.wheel.force-include]
"src/cogkura/py.typed" = "cogkura/py.typed"

[tool.hatch.build.targets.sdist]
include = [
  ".github/workflows/*.yml",
  "CHANGELOG.md",
  "CODE_OF_CONDUCT.md",
  "CONTRIBUTING.md",
  "LICENSE",
  "README.md",
  "SECURITY.md",
  "docs/*.md",
  "examples/**/*.py",
  "examples/**/*.md",
  "examples/**/*.sql",
  "examples/**/*.yml",
  "examples/**/.env.example",
  "src/cogkura/**/*.py",
  "src/cogkura/**/*.sql",
  "src/cogkura/py.typed",
  "tests/*.py",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["cogkura"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=cogkura --cov-report=term-missing"
asyncio_mode = "auto"
markers = [
  "postgres: integration tests requiring a running PostgreSQL instance",
]

[tool.coverage.run]
branch = true
source = ["cogkura"]

[tool.coverage.report]
show_missing = true
skip_covered = true
